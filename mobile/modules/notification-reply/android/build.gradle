plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.thesocialbook.notificationreply'
version = '1.0.0'

android {
  namespace "com.thesocialbook.notificationreply"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
  implementation 'androidx.core:core:1.17.0'
}