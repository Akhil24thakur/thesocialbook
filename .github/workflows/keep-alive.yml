name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TheSocialBook API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 https://thesocialbook-sp3c.onrender.com/api/health)
          echo "Health check returned: $code"
          if [ "$code" != "200" ]; then echo "Unexpected status: $code"; exit 1; fi