name: Build APK (preview)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "preview"
        type: choice
        options: [preview, production]
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (root + workspaces)
        run: npm ci

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            # Secret may be raw JSON or base64-encoded JSON - handle both
            if echo "$GOOGLE_SERVICES_JSON" | head -c1 | grep -q "{"; then
              echo "$GOOGLE_SERVICES_JSON" > mobile/google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > mobile/google-services.json
            fi
            echo "google-services.json restored"
          else
            echo "GOOGLE_SERVICES_JSON secret not set - build may fail if Firebase is required"
          fi
        shell: bash

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/thesocialbook.jks
            echo "keystore restored"
          else
            echo "ANDROID_KEYSTORE_BASE64 not set - EAS will use managed credentials if EXPO_TOKEN is set"
          fi
        shell: bash

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK locally (no EAS cloud quota)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ inputs.profile || 'preview' }}"
          echo "Building profile: $PROFILE"
          # --local runs Gradle on the runner, does NOT count against EAS cloud build quota
          npx eas-cli build --platform android --profile "$PROFILE" --local --non-interactive --output "${{ github.workspace }}/app-${PROFILE}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.profile || 'preview' }}-apk
          path: app-*.apk
          if-no-files-found: error
          retention-days: 14
