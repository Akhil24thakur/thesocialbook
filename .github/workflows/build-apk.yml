name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node ${{ github.workspace }}/.github/scripts/configure-signing.mjs

      - name: Debug autolinking
        working-directory: mobile
        run: |
          echo "--- gradle.properties inlineModules ---"
          grep -c "inlineModules" android/gradle.properties || echo "NOT PRESENT"
          echo "--- mirror with [] ---"
          node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking mirror-kotlin-inline-modules --kotlin-files-mirror-directory "$PWD/android/src/main/java/inline/modules" --inline-modules-list-directory "$PWD/android/build/inline/modules" --watched-directories-serialized "[]" 2>&1 | tail -c 300
          echo "--- search ---"
          npx expo-modules-autolinking search --platform android --json | head -c 300
          echo ""
          echo "--- resolve ---"
          npx expo-modules-autolinking resolve --platform android --json >/dev/null
          echo "autolinking OK"

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload keystore credentials (first run only)
        if: ${{ env.HAS_KEYSTORE == 'false' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-credentials
          path: mobile/android/keystore-credentials.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk