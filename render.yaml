services:
  - type: web
    name: thesocialbook-backend
    env: node
    plan: free
    region: oregon
    buildCommand: |
      cd backend && npm ci && npx prisma generate
    startCommand: |
      cd backend && npx prisma migrate deploy && npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: thesocialbook-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: thesocialbook-db
          property: connectionStringUnpooled
      - key: JWT_SECRET
        generateValue: true
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      - key: FCM_SERVICE_ACCOUNT_FILE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # Supabase kept for rollback ( STORAGE_PROVIDER=supabase to revert )
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false

databases:
  - name: thesocialbook-db
    plan: free
    region: oregon
    ipAllowList: []