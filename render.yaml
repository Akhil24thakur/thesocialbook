services:
  - type: web
    name: thesocialbook-backend
    env: node
    plan: free
    region: oregon
    buildCommand: |
      cd backend && npm ci && npx prisma generate
    startCommand: |
      cd backend && npx prisma migrate deploy && npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: thesocialbook-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: thesocialbook-db
          property: connectionStringUnpooled
      - key: JWT_SECRET
        generateValue: true
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      - key: FCM_SERVICE_ACCOUNT_FILE
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: thesocialbook-db
    plan: free
    region: oregon
    ipAllowList: []